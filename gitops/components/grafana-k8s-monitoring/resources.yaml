---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  destination:
    namespace: grafana-k8s-monitoring
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated: {}
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: k8s-monitoring
    targetRevision: 4.5.3
    helm:
      releaseName: grafana-k8s-monitoring
      valuesObject:
        cluster:
          name: CLUSTER_NAME
        # The chart's own global wins over a feature's global block, so the interval is set once here for every feature
        global:
          scrapeInterval: 120s
        destinations:
          metricsService:
            type: prometheus
            url: PROMETHEUS_ENDPOINT
            auth:
              type: basic
            secret:
              create: false
              name: prometheus
              namespace: grafana-k8s-monitoring
            clusterLabels: [cluster] # https://github.com/grafana/k8s-monitoring-helm/issues/1308#issuecomment-2898457019
          logsService:
            type: loki
            url: LOKI_ENDPOINT
            auth:
              type: basic
            secret:
              create: false
              name: loki
              namespace: grafana-k8s-monitoring
            clusterLabels: [cluster]
          tracesService:
            type: otlp
            protocol: grpc
            metrics:
              enabled: false
            logs:
              enabled: false
            traces:
              enabled: true
            url: TEMPO_ENDPOINT
            auth:
              type: basic
            secret:
              create: false
              name: tempo
              namespace: grafana-k8s-monitoring
            clusterLabels: [cluster]

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-pod-logs-via-loki
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
          # Read positions live in the pod, so without this every restart re-sends up to 7 days of logs and hits Loki's stream limit
          onlyGatherNewLogLines: true
          # The chart sets these as labels, and without this every container gets one Loki stream per output stream
          extraLogProcessingStages: |-
            stage.label_drop {
              values = ["flags", "stream"]
            }

        #######################################################################
        # The below metrics tuning is based on getting down to minimal
        # cost while having *most* dashboards and alerts still working.
        #######################################################################

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-cluster-metrics#feature-cluster-metrics
        clusterMetrics:
          enabled: true
          collector: alloy-metrics
          kube-state-metrics:
            # Endpoints discovery also returns the pod's telemetry port, so keep only the port that serves the metrics
            extraDiscoveryRules: |-
              rule {
                source_labels = ["__meta_kubernetes_pod_container_port_name"]
                regex = "http"
                action = "keep"
              }
            metricsTuning:
              excludeMetrics:
                - kube_configmap_.*
                - kube_deployment_metadata_generation
                - kube_deployment_status_condition
                - kube_job_(annotations|labels|info|created|complete|spec_.*|status_succeeded|status_failed|status_completion_time|status_suspended)
                - kube_node_labels
                - kube_persistentvolume_status_phase
                - kube_persistentvolumeclaim_info
                - kube_persistentvolumeclaim_status_phase
                - kube_pod_spec_volumes_persistentvolumeclaims_info
                - kube_pod_start_time
                - kube_pod_status_reason
                - kube_replicaset_created
                - kube_replicaset_metadata_generation
                - kube_replicaset_spec_replicas
                - kube_replicaset_status.*
                - kube_secret_metadata_resource_version
            extraMetricProcessingRules: |-
              rule {
                action = "labeldrop"
                regex = "container_id"
              }
              rule {
                action = "labeldrop"
                regex = "host_ip"
              }
              rule {
                action = "labeldrop"
                regex = "id"
              }
              rule {
                action = "labeldrop"
                regex = "image"
              }
              rule {
                action = "labeldrop"
                regex = "image_id"
              }
              rule {
                action = "labeldrop"
                regex = "image_spec"
              }
              rule {
                action = "labeldrop"
                regex = "instance"
              }
              rule {
                action = "labeldrop"
                regex = "internal_ip"
              }
              rule {
                action = "labeldrop"
                regex = "pod_ip"
              }
              rule {
                action = "labeldrop"
                regex = "provider_id"
              }
              rule {
                action = "labeldrop"
                regex = "system_uuid"
              }
              rule {
                action = "labeldrop"
                regex = "uid"
              }
          kubelet:
            metricsTuning:
              excludeMetrics:
                - go.*
                - kubelet_cgroup_manager_duration_seconds_bucket
                - kubelet_pod_start_duration_seconds_bucket
                - kubelet_pod_worker_duration_seconds_bucket
                - kubelet_runtime_operations_errors_total
                - kubelet_runtime_operations_total
                - rest_client_requests_total
                - storage_operation.*
          cadvisor:
            metricsTuning:
              excludeMetrics:
                - container_fs.*
                - container_memory_cache
                - container_memory_rss
                - container_memory_swap
                - container_network.*
            extraMetricProcessingRules: |-
              rule {
                action = "labeldrop"
                regex = "id"
              }

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-host-metrics
        hostMetrics:
          enabled: true
          collector: alloy-metrics
          linuxHosts:
            enabled: true
            metricsTuning:
              excludeMetrics:
                - node_cpu_scaling_governor
                - node_cpu_seconds_total
                - node_filesystem_[^as].*
                - node_network.*

        # The chart no longer deploys these unless asked, and clusterMetrics and hostMetrics scrape them
        telemetryServices:
          kube-state-metrics:
            deploy: true
          node-exporter:
            deploy: true

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-cluster-events
        clusterEvents:
          enabled: true
          collector: alloy-singleton

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-prometheus-operator-objects
        # Only useful if you have ServiceMonitors/PodMonitors etc in your cluster for the operator to scrape
        prometheusOperatorObjects:
          enabled: true
          collector: alloy-metrics
          podMonitors:
            metricsTuning:
              excludeMetrics:
                # metrics from commonly used libraries
                - aws_sdk_go.*
                - client_go.*
                - controller_runtime.*
                - workqueue.*
                # cloudnative-pg sends one series per Postgres setting
                - cnpg_pg_settings_.*
          probes:
            metricsTuning:
              excludeMetrics:
                # metrics from commonly used libraries
                - aws_sdk_go.*
                - client_go.*
                - controller_runtime.*
                - workqueue.*
          serviceMonitors:
            metricsTuning:
              excludeMetrics:
                # metrics from commonly used libraries
                - aws_sdk_go.*
                - client_go.*
                - controller_runtime.*
                - workqueue.*
                # karpenter
                - karpenter_cloudprovider.*
                - karpenter_nodes.*
                - karpenter_pods.*
                - operator_node_.*

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-application-observability
        # Only useful if your applications emit otlp metrics
        applicationObservability:
          enabled: false
          collector: alloy-receiver
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411

        # https://github.com/grafana/k8s-monitoring-helm/tree/main/charts/k8s-monitoring/charts/feature-integrations
        integrations:
          collector: alloy-metrics
          alloy:
            instances:
              - name: alloy
                labelSelectors:
                  app.kubernetes.io/name: [alloy-metrics, alloy-logs, alloy-singleton, alloy-receiver]
                metrics:
                  tuning:
                    # Only what shows that a collector drops or fails to send data
                    useDefaultAllowList: false
                    includeMetrics:
                      - alloy_build_info
                      - loki_write_dropped_entries_total
                      - loki_write_sent_entries_total
                      - prometheus_remote_storage_samples_failed_total
                      - prometheus_remote_storage_samples_total

        # https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/docs/collectors/README.md
        collectors:
          alloy-metrics:
            presets: [clustered, statefulset]
          alloy-logs:
            presets: [filesystem-log-reader, daemonset]
          alloy-singleton:
            presets: [singleton]
          # Required for applicationObservability
          alloy-receiver:
            enabled: false
            # Not the daemonset preset, which also adds a toleration for every NoSchedule taint
            controller:
              type: daemonset
            alloy:
              extraPorts:
                - name: otlp-grpc
                  port: 4317
                  targetPort: 4317
                  protocol: TCP
                - name: otlp-http
                  port: 4318
                  targetPort: 4318
                  protocol: TCP
                - name: zipkin
                  port: 9411
                  targetPort: 9411
                  protocol: TCP
---
# The k8s-monitoring chart no longer ships these CRDs, and prometheusOperatorObjects needs them
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  # No resources finalizer, so deleting this Application leaves the CRDs and their objects in place
spec:
  project: observability
  destination:
    namespace: grafana-k8s-monitoring
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated: {}
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus-operator-crds
    targetRevision: 32.0.0
