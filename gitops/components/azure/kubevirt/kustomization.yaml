apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Flavor component: includes the kubevirt base component itself. Use this
# INSTEAD of the plain kubevirt component (including both fails with a
# duplicate-resource error). Requires the azure/disk-csi component, which
# owns the `premium-v2` class used for CDI scratch space.
components:
  - ../../kubevirt

# Point the kubevirt Application at the Azure entrypoint, which renders the
# same cloud-neutral base without the AWS (EBS) storage settings.
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: kubevirt
    patch: |-
      - op: replace
        path: /spec/source/path
        value: gitops/components/azure/kubevirt/kustomize
