---
# Scales the agent pools of an RKE2 cluster between the min and max tags of their scale sets. Runs on the
# server nodes with the server identity, which terraform-rke2-foundation grants Contributor on the node resource group.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: utils
  source:
    chart: cluster-autoscaler
    repoURL: https://kubernetes.github.io/autoscaler
    targetRevision: 9.59.0
    helm:
      releaseName: cluster-autoscaler
      valuesObject:
        cloudProvider: azure
        azureVMType: vmss
        azureUseManagedIdentityExtension: true
        azureUserAssignedIdentityID: SERVER_IDENTITY_CLIENT_ID
        azureResourceGroup: AZURE_NODE_RESOURCE_GROUP
        azureSubscriptionID: AZURE_SUBSCRIPTION_ID
        azureTenantID: AZURE_TENANT_ID
        # Discovers the scale sets tagged cluster-autoscaler-enabled and cluster-autoscaler-name=<cluster>.
        autoDiscovery:
          clusterName: CLUSTER_NAME
        # The chart has no value for the cloud; the provider reads it from this variable.
        extraEnv:
          ARM_CLOUD: AZURE_ENVIRONMENT
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
  destination:
    namespace: kube-system
    name: in-cluster
  syncPolicy:
    automated: {}
