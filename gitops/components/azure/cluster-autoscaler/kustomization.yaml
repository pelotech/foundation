apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../cluster-autoscaler

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: cluster-autoscaler
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cluster-autoscaler
      spec:
        source:
          helm:
            valuesObject:
              cloudProvider: azure
              azureVMType: vmss
              azureUseManagedIdentityExtension: true
              azureUserAssignedIdentityID: SERVER_IDENTITY_CLIENT_ID
              azureResourceGroup: AZURE_NODE_RESOURCE_GROUP
              azureSubscriptionID: AZURE_SUBSCRIPTION_ID
              azureTenantID: AZURE_TENANT_ID
              # Discovers the scale sets tagged cluster-autoscaler-enabled and cluster-autoscaler-name=<cluster>.
              autoDiscovery:
                clusterName: CLUSTER_NAME
              # The chart has no value for the cloud; the provider reads it from this variable.
              extraEnv:
                ARM_CLOUD: AZURE_ENVIRONMENT
              # With several pools, a pending pod lands in the pool that fits it tightest.
              extraArgs:
                expander: least-waste
              # On the control plane nodes, which carry the identity the values name.
              nodeSelector:
                node-role.kubernetes.io/control-plane: "true"
              tolerations:
                - key: CriticalAddonsOnly
                  operator: Exists
                  effect: NoSchedule

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.CLUSTER_NAME
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cluster-autoscaler
        fieldPaths:
          - spec.source.helm.valuesObject.autoDiscovery.clusterName
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.SERVER_IDENTITY_CLIENT_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cluster-autoscaler
        fieldPaths:
          - spec.source.helm.valuesObject.azureUserAssignedIdentityID
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_NODE_RESOURCE_GROUP
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cluster-autoscaler
        fieldPaths:
          - spec.source.helm.valuesObject.azureResourceGroup
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_SUBSCRIPTION_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cluster-autoscaler
        fieldPaths:
          - spec.source.helm.valuesObject.azureSubscriptionID
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_TENANT_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cluster-autoscaler
        fieldPaths:
          - spec.source.helm.valuesObject.azureTenantID
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_ENVIRONMENT
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cluster-autoscaler
        fieldPaths:
          - spec.source.helm.valuesObject.extraEnv.ARM_CLOUD
