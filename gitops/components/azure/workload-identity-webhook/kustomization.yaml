apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./resources.yaml

# The utils project must allow the chart repository and the namespace.
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: AppProject
      name: utils
    patch: |-
      - op: add
        path: /spec/sourceRepos/-
        value: https://azure.github.io/azure-workload-identity/charts
      - op: add
        path: /spec/destinations/-
        value:
          namespace: azure-workload-identity-system
          server: https://kubernetes.default.svc

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_TENANT_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: azure-workload-identity-webhook
        fieldPaths:
          - spec.source.helm.valuesObject.azureTenantID
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_ENVIRONMENT
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: azure-workload-identity-webhook
        fieldPaths:
          - spec.source.helm.valuesObject.azureEnvironment
