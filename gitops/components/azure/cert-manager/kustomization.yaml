apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Flavor component: includes the cert-manager base component itself. Use this
# INSTEAD of the plain cert-manager component (including both fails with a
# duplicate-resource error). Binds cert-manager to its Azure workload identity
# and adds the Azure DNS dns01 solver. Requires CERT_MANAGER_CLIENT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_DNS_RESOURCE_GROUP and AZURE_DNS_ZONE in
# kustomize-environment.
components:
  - ../../cert-manager

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: cert-manager
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cert-manager
      spec:
        source:
          helm:
            valuesObject:
              podLabels:
                azure.workload.identity/use: "true"
              serviceAccount:
                annotations:
                  azure.workload.identity/client-id: CERT_MANAGER_CLIENT_ID
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: create-issuer
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: create-issuer
      spec:
        source:
          helm:
            valuesObject:
              solvers:
                dns01:
                  azureDNS:
                    enabled: true
                    subscriptionID: AZURE_SUBSCRIPTION_ID
                    resourceGroupName: AZURE_DNS_RESOURCE_GROUP
                    hostedZoneName: AZURE_DNS_ZONE
                    clientID: CERT_MANAGER_CLIENT_ID

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.CERT_MANAGER_CLIENT_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: cert-manager
        fieldPaths:
          - spec.source.helm.valuesObject.serviceAccount.annotations.[azure.workload.identity/client-id]
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: create-issuer
        fieldPaths:
          - spec.source.helm.valuesObject.solvers.dns01.azureDNS.clientID
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_SUBSCRIPTION_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: create-issuer
        fieldPaths:
          - spec.source.helm.valuesObject.solvers.dns01.azureDNS.subscriptionID
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_DNS_RESOURCE_GROUP
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: create-issuer
        fieldPaths:
          - spec.source.helm.valuesObject.solvers.dns01.azureDNS.resourceGroupName
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_DNS_ZONE
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: create-issuer
        fieldPaths:
          - spec.source.helm.valuesObject.solvers.dns01.azureDNS.hostedZoneName
