apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./resources.yaml

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.CLUSTER_NAME
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.settings.clusterName
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.CLUSTER_ENDPOINT
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.settings.clusterEndpoint
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.KARPENTER_CLIENT_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.serviceAccount.annotations.[azure.workload.identity/client-id]
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_SUBSCRIPTION_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=AZURE_SUBSCRIPTION_ID].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_LOCATION
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=LOCATION].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.AZURE_NODE_RESOURCE_GROUP
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=AZURE_NODE_RESOURCE_GROUP].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.VNET_SUBNET_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=VNET_SUBNET_ID].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.KUBELET_IDENTITY_CLIENT_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=KUBELET_IDENTITY_CLIENT_ID].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.KUBELET_IDENTITY_ID
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=NODE_IDENTITIES].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.NETWORK_PLUGIN
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=NETWORK_PLUGIN].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.NETWORK_PLUGIN_MODE
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=NETWORK_PLUGIN_MODE].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.NETWORK_DATAPLANE
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=NETWORK_DATAPLANE].value
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.SSH_PUBLIC_KEY
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: karpenter
        fieldPaths:
          - spec.sources.[chart=karpenter].helm.valuesObject.controller.env.[name=SSH_PUBLIC_KEY].value
