---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    chart: traefik
    repoURL: ghcr.io/traefik/helm
    targetRevision: 41.2.0
    helm:
      releaseName: traefik
      valuesObject:
        providers:
          kubernetesIngressNGINX:
            # Serves `ingressClassName: nginx` Ingresses (the class the retired
            # ingress-nginx controller owned), including the
            # nginx.ingress.kubernetes.io/* annotations:
            # https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/ingress-nginx/
            enabled: true
            ingressClass: nginx
            controllerClass: k8s.io/ingress-nginx
            # nginx is the cluster default IngressClass (see ingress-class.yaml);
            # also serve class-less Ingresses
            watchIngressWithoutClass: true
            # parity with historical nginx strict-validate-path-type=false: without
            # this, Traefik rejects an ENTIRE Ingress whose Prefix/Exact path
            # contains regex characters
            strictValidatePathType: false
            # writes Ingress .status.loadBalancer so external-dns publishes records
            publishService:
              enabled: true
            # Parity with nginx's allow-snippet-annotations=true. Traefik parses a
            # subset of directives (add_header, proxy_set_header, more_set_headers,
            # set, if, return, ...) — it never executes raw nginx config.
            allowSnippetAnnotations: true
            # changes the proxy read timeout from 60 to 1800
            proxyReadTimeout: 1800
          kubernetesIngress:
            enabled: false # nginx-compat provider only; no second ingress class
          # kubernetesGateway stays disabled: envoy-gateway owns the Gateway API
        ingressClass:
          # The chart would otherwise create a `traefik` IngressClass marked default —
          # two defaults (nginx is default today) makes the API server reject any new
          # class-less Ingress. The nginx-compat provider matches class `nginx` by name.
          enabled: false
        ports:
          # No hostNetwork/hostPort, so the pod-identity port-80 conflict that forced
          # nginx onto containerPort 81 does not apply here.
          # trustedIPs 0.0.0.0/0 matches nginx's proxy-real-ip-cidr default: clients
          # can't spoof through the NLB (it prepends its own PROXY header), and direct
          # pod connections are only reachable from inside the VPC.
          web:
            proxyProtocol:
              trustedIPs:
                - "0.0.0.0/0"
            forwardedHeaders:
              trustedIPs:
                - "0.0.0.0/0"
          websecure:
            proxyProtocol:
              trustedIPs:
                - "0.0.0.0/0"
            forwardedHeaders:
              trustedIPs:
                - "0.0.0.0/0"
        service:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
            service.beta.kubernetes.io/aws-load-balancer-name: TRAEFIK_NLB_NAME
            service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
            service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: proxy_protocol_v2.enabled=true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            memory: "128Mi"
  destination:
    namespace: traefik
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
