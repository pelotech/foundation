---
# The `nginx` IngressClass, owned by this component. It must exist even though
# Traefik matches the class by name: the AWS Load Balancer Controller's
# validating webhook (vingress.elbv2.k8s.aws) resolves the IngressClass of
# every Ingress write and DENIES the request when the object is missing —
# which would break ArgoCD syncs of class-nginx Ingresses and cert-manager
# http01 solver Ingress creation.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    # the cluster default; class-less Ingresses are served by Traefik
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  # matches the controllerClass the traefik nginx-compat provider claims
  controller: k8s.io/ingress-nginx
