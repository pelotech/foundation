---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: utils
  destination:
    namespace: karpenter
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
  sources:
    - chart: karpenter-crd
      repoURL: public.ecr.aws/karpenter
      targetRevision: 1.15.1
      helm:
        valuesObject:
          webhook:
            serviceNamespace: karpenter
    - chart: karpenter
      repoURL: public.ecr.aws/karpenter
      targetRevision: 1.15.1
      helm:
        releaseName: karpenter
        skipCrds: true
        valuesObject:
          # Resolve AWS endpoints through the VPC resolver, not coredns, so Karpenter can still
          # launch nodes when cluster DNS is down (https://karpenter.sh/docs/troubleshooting/).
          dnsPolicy: Default
          serviceAccount:
            # Pod-identity-ready by default: no IRSA annotations. Clusters
            # using IRSA use the aws/karpenter-irsa component instead (requires KARPENTER_ROLE_ARN).
            create: "true"
            name: "karpenter"
          settings:
            clusterName: CLUSTER_NAME
            interruptionQueue: CLUSTER_NAME
            featureGates:
              spotToSpotConsolidation: true
              nodeRepair: true
              nodeOverlay: true
