---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: utils
  destination:
    namespace: karpenter
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
  sources:
    - chart: karpenter-crd
      repoURL: public.ecr.aws/karpenter
      targetRevision: 1.14.1
      helm:
        valuesObject:
          webhook:
            serviceNamespace: karpenter
    - chart: karpenter
      repoURL: public.ecr.aws/karpenter
      targetRevision: 1.14.1
      helm:
        releaseName: karpenter
        skipCrds: true
        valuesObject:
          # Resolve AWS endpoints through the VPC resolver, not coredns, so Karpenter can still
          # launch nodes when cluster DNS is down (https://karpenter.sh/docs/troubleshooting/).
          dnsPolicy: Default
          controller:
            image:
              digest: >-
                sha256:4b779589dcc7d837d24775f5ef185e7f93645945e5531925240d70814c1a9348
              repository: ghcr.io/pelotech/karpenter-aws
              tag: v1.14.1x
            env:
              - name: IGNORED_NODE_SELECTOR_REQUIREMENTS
                value: scheduling.node.kubevirt.io/tsc-frequency-*
          serviceAccount:
            # Pod-identity-ready by default: no IRSA annotations. Clusters
            # using IRSA use the aws/karpenter-irsa component instead (requires KARPENTER_ROLE_ARN).
            create: "true"
            name: "karpenter"
          settings:
            clusterName: CLUSTER_NAME
            interruptionQueue: CLUSTER_NAME
            featureGates:
              spotToSpotConsolidation: true
              nodeRepair: true
              nodeOverlay: true
---
# Default node class. Override fields from the cluster overlay with a kustomize patch, or add more classes beside it.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    # Applied after the karpenter Application is healthy, so its CRDs exist.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  amiFamily: AL2023
  # Karpenter rolls nodes when a new AMI ships under this alias; pin a version in production overlays.
  amiSelectorTerms:
    - alias: al2023@latest
  kubelet:
    maxPods: 110
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
  role: KarpenterNodeRole-CLUSTER_NAME
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME
