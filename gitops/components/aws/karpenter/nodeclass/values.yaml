# Set by the component from kustomize-environment CLUSTER_NAME. Names the node role and the
# karpenter.sh/discovery tag the stack puts on its subnets and security groups.
clusterName: CLUSTER_NAME

nodeClass:
  amiFamily: AL2023
  amiAlias: al2023@latest
  maxPods: 110
  volumeSize: 100Gi
  volumeType: gp3
