---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    chart: aws-load-balancer-controller
    repoURL: https://aws.github.io/eks-charts
    targetRevision: 3.5.0
    helm:
      releaseName: aws-load-balancer-controller
      valuesObject:
        hostNetwork: true
        metricsBindAddr: ':8085'
        # Pod-identity-ready by default: no IRSA annotations. Clusters using
        # IRSA use the aws/alb-irsa component instead (requires ALB_ROLE_ARN).
        serviceAccount:
          create: "true"
          name: "aws-load-balancer-controller"
        clusterName: CLUSTER_NAME
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
#        watchNamespace: ingress-nginx # NOTE: Currently disabled however may need to bring back to limit aws lb controller.
  ignoreDifferences:
    - kind: Secret
      name: aws-load-balancer-tls
      jqPathExpressions:
        - .data
  destination:
    namespace: alb
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
