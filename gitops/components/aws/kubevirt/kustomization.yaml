apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Needs aws/ebs-csi for the gp3 class and aws/karpenter for the node labels.
components:
  - ../../kubevirt
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: kubevirt
    patch: |-
      - op: replace
        path: /spec/source/path
        value: gitops/components/aws/kubevirt/kustomize
