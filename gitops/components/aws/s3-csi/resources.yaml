---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s3-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: storage
  destination:
    namespace: kube-system
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
  source:
    chart: aws-mountpoint-s3-csi-driver
    repoURL: https://awslabs.github.io/mountpoint-s3-csi-driver
    targetRevision: 2.7.0
    helm:
      releaseName: aws-mountpoint-s3-csi-driver
      valuesObject:
        node:
          # Pod-identity-ready by default: no IRSA annotations. Clusters using
          # IRSA use the aws/s3-csi-irsa component instead (requires S3_CSI_ROLE_ARN).
          serviceAccount:
            name: "s3-csi-driver"
