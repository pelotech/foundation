apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
  - ../../traefik

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: traefik
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: traefik
      spec:
        source:
          helm:
            valuesObject:
              service:
                annotations:
                  service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
                  service.beta.kubernetes.io/aws-load-balancer-name: TRAEFIK_NLB_NAME
                  service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
                  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
                  service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
                  service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: proxy_protocol_v2.enabled=true

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.TRAEFIK_NLB_NAME
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: traefik
        fieldPaths:
          - spec.source.helm.valuesObject.service.annotations.[service.beta.kubernetes.io/aws-load-balancer-name]
