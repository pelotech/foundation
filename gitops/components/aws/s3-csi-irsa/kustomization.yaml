apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Flavor component: includes the s3-csi base component itself. Use this
# INSTEAD of the plain s3-csi component (including both fails with a
# duplicate-resource error).
components:
  - ../s3-csi

# Opt-in IRSA for the S3 CSI driver: adds the IAM role annotations and
# requires S3_CSI_ROLE_ARN in kustomize-environment.
# Safe to keep when migrating to or from EKS Pod Identity.
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: s3-csi
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: s3-csi
      spec:
        source:
          helm:
            valuesObject:
              node:
                serviceAccount:
                  annotations:
                    eks.amazonaws.com/role-arn: S3_CSI_ROLE_ARN
                    eks.amazonaws.com/sts-regional-endpoints: "true"

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.S3_CSI_ROLE_ARN
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: s3-csi
        fieldPaths:
          - spec.source.helm.valuesObject.node.serviceAccount.annotations.[eks.amazonaws.com/role-arn]
