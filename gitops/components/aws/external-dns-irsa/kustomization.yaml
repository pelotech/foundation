apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Flavor component: includes the external-dns base component itself. Use this
# INSTEAD of the plain external-dns component (including both fails with a
# duplicate-resource error).
components:
  - ../../external-dns

# Opt-in IRSA for external-dns: adds the IAM role annotations to the
# ServiceAccount and requires EXTERNAL_DNS_ROLE_ARN in kustomize-environment.
# Omit this component on clusters using EKS Pod Identity — the annotation must
# be absent there (a leftover role-arn annotation sits earlier in the SDK
# credential chain and can break auth).
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: external-dns
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: external-dns
      spec:
        source:
          helm:
            valuesObject:
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: EXTERNAL_DNS_ROLE_ARN
                  eks.amazonaws.com/sts-regional-endpoints: "true"

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.EXTERNAL_DNS_ROLE_ARN
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: external-dns
        fieldPaths:
          - spec.source.helm.valuesObject.serviceAccount.annotations.[eks.amazonaws.com/role-arn]
