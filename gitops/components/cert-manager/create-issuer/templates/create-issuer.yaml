{{- include "create-issuer.validate" . -}}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName }}
  labels:
    {{- include "create-issuer.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.acmeIssuerEmail }}
    privateKeySecretRef:
      name: {{ .Values.issuerName }}
    solvers:
      {{- range .Values.solvers.ingress }}
      - http01:
          ingress:
            class: {{ required "solvers.ingress entries require class" .class }}
        {{- with include "create-issuer.solverSelector" . }}{{ . | trim | nindent 8 }}{{- end }}
      {{- end }}
      {{- range .Values.solvers.gateway }}
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ required "solvers.gateway entries require name" .name }}
                namespace: {{ required "solvers.gateway entries require namespace" .namespace }}
        {{- with include "create-issuer.solverSelector" . }}{{ . | trim | nindent 8 }}{{- end }}
      {{- end }}
      {{- with .Values.solvers.dns01.route53 }}
      {{- if .enabled }}
      - dns01:
          route53:
            region: {{ required "solvers.dns01.route53 requires region" .region }}
        {{- with include "create-issuer.solverSelector" . }}{{ . | trim | nindent 8 }}{{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.solvers.dns01.azureDNS }}
      {{- if .enabled }}
      - dns01:
          azureDNS:
            subscriptionID: {{ required "solvers.dns01.azureDNS requires subscriptionID" .subscriptionID }}
            resourceGroupName: {{ required "solvers.dns01.azureDNS requires resourceGroupName" .resourceGroupName }}
            hostedZoneName: {{ required "solvers.dns01.azureDNS requires hostedZoneName" .hostedZoneName }}
            environment: {{ .environment }}
            managedIdentity:
              clientID: {{ required "solvers.dns01.azureDNS requires clientID" .clientID }}
        {{- with include "create-issuer.solverSelector" . }}{{ . | trim | nindent 8 }}{{- end }}
      {{- end }}
      {{- end }}
