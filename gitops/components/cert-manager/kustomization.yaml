apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Works alone with http01. The <cloud>/cert-manager flavors include it and add dns01, so list one or the other.
resources:
  - ./resources.yaml

replacements:

  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.ACME_ISSUER_EMAIL
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: create-issuer
        fieldPaths:
          - spec.source.helm.valuesObject.acmeIssuerEmail
