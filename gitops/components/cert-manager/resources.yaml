---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      valuesObject:
        installCRDs: true
        # Pod-identity-ready by default: no IRSA annotations. Clusters using
        # IRSA for cert-manager use the aws/cert-manager-irsa component instead, which
        # includes this one, adds the annotations, and requires CERT_MANAGER_ROLE_ARN.
        serviceAccount:
          create: true
          name: cert-manager
        extraEnv:
          - name: AWS_REGION
            value: "us-east-1"
        securityContext:
          fsGroup: 1001
        resources:
          requests:
            cpu: "15m"
            memory: "105M"
          limits:
            cpu: "15m"
            memory: "105M"
        webhook:
          hostNetwork: true
          securePort: 10251
          resources:
            requests:
              cpu: "15m"
              memory: "105M"
            limits:
              cpu: "15m"
              memory: "105M"
        cainjector:
          resources:
            requests:
              cpu: "15m"
              memory: "105M"
            limits:
              cpu: "15m"
              memory: "105M"
  destination:
    namespace: cert-manager
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: create-issuer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    repoURL: 'https://github.com/pelotech/foundation'
    path: gitops/components/cert-manager/create-issuer
    helm:
      releaseName: create-issuer
      valuesObject:
        acmeIssuerEmail: ACME_ISSUER_EMAIL
        awsRegion: AWS_REGION
    targetRevision: v5.0.4 # x-release-please-version
  destination:
    namespace: cert-manager
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
