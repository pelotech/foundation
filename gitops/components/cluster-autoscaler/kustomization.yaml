apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./resources.yaml

# The utils project must allow the chart repository.
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: AppProject
      name: utils
    patch: |-
      - op: add
        path: /spec/sourceRepos/-
        value: https://kubernetes.github.io/autoscaler
