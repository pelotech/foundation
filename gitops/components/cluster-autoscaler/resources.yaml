---
# The chart alone: a cloud flavor sets the provider, the credentials and where the controller runs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: utils
  source:
    chart: cluster-autoscaler
    repoURL: https://kubernetes.github.io/autoscaler
    targetRevision: 9.59.0
    helm:
      releaseName: cluster-autoscaler
      valuesObject:
        image:
          # 1.35.0 lacks the Azure v7 sizes in its instance list, so a pool at zero never scales. Drop with the next chart.
          tag: v1.35.2
  destination:
    namespace: kube-system
    name: in-cluster
  syncPolicy:
    automated: {}
