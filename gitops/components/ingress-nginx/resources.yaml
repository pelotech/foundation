---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      # publishService controls whether nginx writes Ingress .status.loadBalancer
      # (where external-dns points DNS). Default "true" preserves standalone
      # behavior; when the traefik component is enabled, its NGINX_PUBLISH_SERVICE
      # replacement overrides this to coordinate the status-ownership switch.
      parameters:
        - name: controller.publishService.enabled
          value: "true"
      valuesObject:
        controller:
          containerPort:
            http: 81 # stupid pod identity uses port 80
          hostNetwork: true
          service:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
              service.beta.kubernetes.io/aws-load-balancer-name: NLB_NAME
              service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip" #TODO: might need to be instance
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing" #TODO: make configurable to internal only
          ingressClassResource:
            default: true
          extraArgs:
            http-port: 81 # stupid pod identity uses port 80
            enable-ssl-passthrough: "" # https://github.com/kubernetes/ingress-nginx/issues/8052
          config:
            strict-validate-path-type: false # https://github.com/kubernetes/ingress-nginx/issues/11176
            enable-real-ip: "true" # https://github.com/kubernetes/ingress-nginx/issues/8052
            forwarded-for-header: "proxy_protocol" # https://github.com/kubernetes/ingress-nginx/issues/8052
            allow-snippet-annotations: "true"
          resources:
            limits:
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
  destination:
    namespace: ingress-nginx
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
