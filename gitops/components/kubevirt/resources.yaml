---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: utils
  destination:
    namespace: kubevirt
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # First install: the instancetype objects reference CRDs the operator in the same sync creates.
      - SkipDryRunOnMissingResource=true
    automated: {}
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  source:
    repoURL: 'https://github.com/pelotech/foundation'
    path: 'gitops/components/kubevirt/kustomize'
    targetRevision: v6.0.0 # x-release-please-version
