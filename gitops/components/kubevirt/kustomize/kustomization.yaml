apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./operators
  - ./resources.yaml
  - https://github.com/kubevirt/common-instancetypes//VirtualMachineClusterPreferences?ref=v1.7.0

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: virt-operator
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
      - op: remove
        path: /spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cdi-operator
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true
  # cdi-operator serves only v1beta1 and prunes v1alpha1 from the live CRD. The test op fails if a CDI bump reorders the versions.
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: cdis.cdi.kubevirt.io
    patch: |-
      - op: test
        path: /spec/versions/0/name
        value: v1alpha1
      - op: remove
        path: /spec/versions/0
