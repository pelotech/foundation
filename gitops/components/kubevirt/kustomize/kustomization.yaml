apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entrypoint for the `kubevirt` component's Argo CD Application
# (gitops/components/kubevirt/resources.yaml). It renders the cloud-neutral
# base plus the AWS storage settings, so AWS clusters keep the exact
# resources they had before the base was split out. Other clouds use their
# own flavor (e.g. gitops/components/azure/kubevirt), which points the
# Application at a different entrypoint over the same ./base.
resources:
  - ./base

components:
  - ./aws
