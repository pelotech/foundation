---
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
      - HonorWaitForFirstConsumer
    # scratchSpaceStorageClass is cloud-specific: each entrypoint sets it to a
    # WaitForFirstConsumer class (see ../aws).
  customizeComponents:
    patches:
      - resourceType: Deployment
        resourceName: cdi-apiserver
        patch: '{"spec":{"template":{"spec": {"hostNetwork": true}}}}'
        type: strategic
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "cdi.kubevirt.io:clone"
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]
---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    commonInstancetypesDeployment:
      enabled: false
    migrations:
      parallelMigrationsPerCluster: 100
      parallelOutboundMigrationsPerNode: 20   # a m5n.metal node has a 100Gbps network throughput
      bandwidthPerMigration: 5Gi
      completionTimeoutPerGiB: 60
      progressTimeout: 60
      allowAutoConverge: true
    developerConfiguration:
      useEmulation: false
      featureGates:
        - VMExport
        - Snapshot
        - LiveMigration
        - ExpandDisks
  customizeComponents:
    patches:
      - resourceType: Deployment
        resourceName: virt-api
        patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/args/1", "value": "8456"}, {"op": "replace", "path": "/spec/template/spec/containers/0/ports/0/containerPort", "value": 8456},{"op": "replace", "path": "/spec/template/spec/containers/0/readinessProbe/httpGet/port", "value": 8456},{"op": "replace", "path": "/spec/template/spec/containers/0/ports/1/containerPort", "value": 8457}]'
        type: json
      - resourceType: Service
        resourceName: virt-api
        patch: '[{"op": "replace", "path": "/spec/ports/0/targetPort", "value": 8456}]'
        type: json
      - resourceType: Deployment
        resourceName: virt-api
        patch: '{"spec":{"template":{"spec": {"hostNetwork": true}}}}'
        type: strategic
      - resourceType: Deployment
        resourceName: virt-template-apiserver
        patch: '{"spec":{"template":{"spec": {"hostNetwork": true}}}}'
        type: strategic
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
  workloads:
    # nodeSelector is cloud-specific: VMs need nodes that support (nested)
    # virtualization (see ../aws).
    nodePlacement:
      tolerations:
        - key: pelo.tech/tenant
          operator: Exists
        - key: pelo.tech/usage
          operator: Exists
        # TODO: remove this once all the existing workloads moved to tenant based placement
        - key: pelo.tech/kvm
          operator: Exists

  # infra.nodePlacement must be set: when it is unset, kubevirt requires
  # control-plane/master nodes for virt-api and virt-controller
  # https://github.com/kubevirt/kubevirt/blob/v1.9.0/pkg/virt-operator/resource/placement/placement.go#L46
  # kubevirt adds kubernetes.io/os: linux to these pods anyway. Clouds add
  # their own selectors on top (see ../aws).
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/os: linux
