---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: utils
  destination:
    namespace: argocd
    name: in-cluster
  syncPolicy:
    automated: {}
  source:
    repoURL: oci://ghcr.io/argoproj/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      valuesObject:
        # guide: https://github.com/argoproj-labs/argocd-image-updater/issues/112#issuecomment-1058465942
        # The v1.3 controller lists every Application at start; a few hundred of them OOMKilled that warm-up at 105M
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 15m
            memory: 256Mi
