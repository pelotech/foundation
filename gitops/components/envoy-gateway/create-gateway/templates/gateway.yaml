---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: eg-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-proxy
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
          service.beta.kubernetes.io/aws-load-balancer-name: "{{ .Values.nlbName }}"
          service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayClassName: eg
  allowedListeners:
    namespaces:
      from: All
  listeners:
    {{- if .Values.gateway.acmeSolver }}
    - name: acme-solver
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
    {{- with .Values.gateway.extraListeners }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (not .Values.gateway.acmeSolver) (not .Values.gateway.extraListeners) }}
    # HACK: a Gateway must carry at least one listener even when all real listeners
    # live in ListenerSets; drop this once
    # https://github.com/kubernetes-sigs/gateway-api/issues/4425 is resolved
    - name: placeholder
      port: 65535
      protocol: HTTP
      hostname: placeholder.invalid
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              placeholder: placeholder
    {{- end }}
