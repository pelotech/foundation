apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Shared base of the <cloud>/external-dns flavors. List a flavor, not this component.
resources:
  - resources.yaml

replacements:
  - source:
      version: v1
      kind: ConfigMap
      name: kustomize-environment
      fieldPath: data.CLUSTER_NAME
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: external-dns
        fieldPaths:
          - spec.source.helm.valuesObject.txtOwnerId
