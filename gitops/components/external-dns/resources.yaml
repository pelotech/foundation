---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns
    targetRevision: 1.23.0
    helm:
      releaseName: external-dns
      valuesObject:
        txtOwnerId: CLUSTER_NAME
        # No cloud settings here, and the chart defaults the provider to aws:
        # always list a flavor (aws/external-dns, aws/external-dns-irsa,
        # azure/external-dns) instead of this component.
        serviceAccount:
          create: true
          name: external-dns-controller
        policy: sync
        registry: txt
        txtPrefix: xdns-
        resources:
          limits:
            memory: 105M
          requests:
            cpu: 50m
            memory: 105M
  destination:
    namespace: external-dns
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
