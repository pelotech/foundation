---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns
    targetRevision: 1.21.1
    helm:
      releaseName: external-dns
      valuesObject:
        txtOwnerId: CLUSTER_NAME
        # Pod-identity-ready by default: no IRSA annotations. Clusters using
        # IRSA for external-dns use the aws/external-dns-irsa component instead, which
        # includes this one, adds the annotations, and requires EXTERNAL_DNS_ROLE_ARN.
        serviceAccount:
          create: true
          name: external-dns-controller
        provider:
          name: aws
        env:
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        policy: sync
        registry: txt
        txtPrefix: xdns-
        resources:
          limits:
            memory: 105M
          requests:
            cpu: 50m
            memory: 105M
  destination:
    namespace: external-dns
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
