apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./resources.yaml

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: AppProject
      name: utils
    patch: |-
      - op: add
        path: /spec/destinations/-
        value:
          namespace: argo-workflows
          server: https://kubernetes.default.svc
