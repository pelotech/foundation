apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Crossplane management of the Harbor instance: provider-harbor, its ProviderConfig and the
# instance-wide jobs. List it after the harbor flavor in components. The consumer provides the
# crossplane-harbor-admin-creds Secret and its own managed resources (projects, robots, ...).
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: harbor
    patch: |-
      - op: add
        path: /spec/sources/1/helm/valuesObject/crossplane
        value:
          enabled: true
      # provider-harbor CRDs land after the Provider syncs.
      - op: add
        path: /spec/syncPolicy/syncOptions/-
        value: SkipDryRunOnMissingResource=true
      # Crossplane resolves *Ref fields and writes the resolved value back into the literal field.
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: robotaccount.harbor.crossplane.io
            kind: RobotAccount
            jqPathExpressions:
              - .spec.forProvider.permissions[].namespace
  # Argo CD's built-in Crossplane health check reports Degraded whenever LastAsyncOperation is
  # False, and upjet never clears that condition after one failed apply (crossplane/upjet#679),
  # so a harbor-core restart during a reconcile leaves resources red for good. Trust Synced and
  # Ready instead. Wildcards only work under the resource.customizations key.
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        resource.customizations: |
          "*.harbor.crossplane.io/*":
            health.lua: |
              hs = { status = "Progressing", message = "Waiting for the provider" }
              if obj.status == nil or obj.status.conditions == nil then
                return hs
              end
              local ready = false
              for _, c in ipairs(obj.status.conditions) do
                if c.type == "Synced" and c.status == "False" then
                  hs.status = "Degraded"
                  hs.message = c.message
                  return hs
                end
                if c.type == "Ready" and c.status == "True" then
                  ready = true
                end
              end
              if ready then
                hs.status = "Healthy"
                hs.message = "Resource is up-to-date."
              end
              return hs
