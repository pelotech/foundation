{{- if .Values.crossplane.enabled }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  package: {{ .Values.crossplane.provider.package }}
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1
---
apiVersion: harbor.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: harbor
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: {{ .Release.Namespace }}
      name: {{ .Values.crossplane.provider.credentialsSecret }}
      key: credentials
{{- end }}
