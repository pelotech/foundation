{{- if .Values.crossplane.enabled }}
---
apiVersion: garbagecollection.harbor.crossplane.io/v1alpha1
kind: GarbageCollection
metadata:
  name: harbor-gc
spec:
  forProvider:
    schedule: {{ .Values.crossplane.garbageCollection.schedule | quote }}
    deleteUntagged: true
    workers: 1
  providerConfigRef:
    name: harbor
---
apiVersion: purgeauditlog.harbor.crossplane.io/v1alpha1
kind: PurgeAuditLog
metadata:
  name: harbor-purge-audit-log
spec:
  forProvider:
    schedule: {{ .Values.crossplane.auditLogPurge.schedule | quote }}
    auditRetentionHour: {{ .Values.crossplane.auditLogPurge.retentionHours }}
    includeEventTypes: "create,pull,delete"
  providerConfigRef:
    name: harbor
---
apiVersion: interrogationservices.harbor.crossplane.io/v1alpha1
kind: InterrogationServices
metadata:
  name: harbor-interrogation-services
spec:
  forProvider:
    defaultScanner: "Trivy"
    vulnerabilityScanPolicy: {{ .Values.crossplane.scanner.schedule | quote }}
  providerConfigRef:
    name: harbor
{{- end }}
