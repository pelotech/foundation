apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: gnupg-home
          emptyDir: {}
        - name: sops-gpg
          secret:
            secretName: sops-gpg
            optional: true
      initContainers:
        - name: install-custom-tools
          # Alpine-based Helm image: keeps busybox wget/tar for the binary downloads
          # below and adds a helm binary so helm-secrets can be installed the way
          # upstream documents it. Track ArgoCD's bundled Helm major version
          # (hack/tool-versions.sh in argoproj/argo-cd) — Helm 4 here, Helm 4 there.
          image: alpine/helm:4.2.1
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          env:
            # renovate: datasource=github-releases packageName=jkroepke/helm-secrets
            - name: HELM_SECRETS_VERSION
              value: "4.7.7"
            # renovate: datasource=github-releases packageName=kubernetes/kubernetes
            - name: KUBECTL_VERSION
              value: "1.32.8"
            # renovate: datasource=github-releases packageName=helmfile/vals
            - name: VALS_VERSION
              value: "0.42.0"
            # renovate: datasource=github-releases packageName=getsops/sops
            - name: SOPS_VERSION
              value: "3.10.2"
            # Install plugins into the shared emptyDir, not the init container's HOME
            - name: HELM_PLUGINS
              value: /custom-tools/helm-plugins
          args:
            - |
              # Start from a clean plugin dir. Init containers re-run when a pod
              # restarts but the emptyDir survives, and `helm plugin install` has no
              # --force, so a leftover dir aborts the run with "plugin already exists".
              rm -rf /custom-tools/helm-plugins
              mkdir -p /custom-tools/helm-plugins

              GO_ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')

              wget -qO /custom-tools/curl https://github.com/moparisthebest/static-curl/releases/latest/download/curl-${GO_ARCH}
              wget -qO /custom-tools/kubectl https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${GO_ARCH}/kubectl
              wget -qO /custom-tools/sops https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${GO_ARCH}
              wget -qO- https://github.com/helmfile/vals/releases/download/v${VALS_VERSION}/vals_${VALS_VERSION}_linux_${GO_ARCH}.tar.gz | tar zx -C /custom-tools vals

              # Helm 4 (ArgoCD >= 3.5) dropped all-in-one plugins per HIP-0026, so the
              # legacy helm-secrets.tar.gz no longer registers a `secrets` subcommand.
              # helm-secrets >= 4.7.0 ships three typed plugins instead; install each.
              #
              # --verify=false: Helm 4 defaults --verify=true and reads a GPG keyring
              # from $HOME/.gnupg/pubring.gpg, which this image does not carry. Skipping
              # keeps the same trust posture as the tarball extraction this replaced
              # (HTTPS from a pinned version, no signature check). To verify instead,
              # import the jkroepke signing key into a legacy keyring and pass --keyring.
              for plugin in secrets secrets-getter secrets-post-renderer; do
                helm plugin install --verify=false \
                  oci://ghcr.io/jkroepke/helm-secrets/${plugin}:${HELM_SECRETS_VERSION}
              done

              cp /custom-tools/helm-plugins/secrets/scripts/wrapper/helm.sh /custom-tools/helm
              chmod +x /custom-tools/*
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
        - name: install-ksops
          image: viaductoss/ksops:v4.1.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              mv ksops /custom-tools/
              mv $GOPATH/bin/kustomize /custom-tools/
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
        # Import the private gpg key from the secret into argocd
        - name: import-gpg-key
          image: quay.io/argoproj/argocd:v3.5.0@sha256:c298cedbaeb31532ba8d4e9904eba9e4987e067293fbd86400c5194e78f743d5
          command: ["/bin/sh", "-c"]
          args:
            - "gpg --import /sops-gpg/sops.asc || true"
          env:
            - name: GNUPGHOME
              value: /gnupg-home/.gnupg
          volumeMounts:
            - name: sops-gpg
              mountPath: /sops-gpg
            - name: gnupg-home
              mountPath: /gnupg-home
      # The helm-secrets wrapper is mounted at /usr/local/sbin/helm, which precedes
      # /usr/local/bin on PATH and therefore shadows the real helm; the wrapper
      # re-invokes the real one via HELM_SECRETS_HELM_PATH below. The sbin/bin
      # split is the whole mechanism, not a typo.
      containers:
        - name: argocd-repo-server
          envFrom:
            - secretRef:
                name: sops-age
                optional: true
          env:
            - name: HELM_PLUGINS
              value: /custom-tools/helm-plugins
            - name: HELM_SECRETS_CURL_PATH
              value: /custom-tools/curl
            - name: HELM_SECRETS_SOPS_PATH
              value: /custom-tools/sops
            - name: HELM_SECRETS_VALS_PATH
              value: /custom-tools/vals
            - name: HELM_SECRETS_KUBECTL_PATH
              value: /custom-tools/kubectl
            - name: HELM_SECRETS_BACKEND
              value: sops
            # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
            - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
              value: "false"
            - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
              value: "true"
            - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
              value: "false"
            - name: HELM_SECRETS_WRAPPER_ENABLED
              value: "true"
            - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
              value: "true"
            - name: HELM_SECRETS_HELM_PATH
              value: /usr/local/bin/helm
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
            - name: custom-tools
              mountPath: /usr/local/sbin/helm
              subPath: helm
            - name: custom-tools
              mountPath: /usr/local/bin/kustomize
              subPath: kustomize
            - name: custom-tools
              mountPath: /usr/local/bin/ksops
              subPath: ksops
            - name: gnupg-home
              mountPath: /home/argocd/.gnupg
              subPath: .gnupg
